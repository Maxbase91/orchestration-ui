# The gate the repository did not have.
#
# 72 commits — including a database migration — landed with no automated check,
# so the only thing that ever failed was a Vercel deploy. That is why a run of
# commits reads "fix: cast Neon date assignments", "fix: resolve remaining vercel
# function type errors": the errors were real, and the deployment found them.
#
# `tsc -b` now covers api/ as well (tsconfig.api.json), which is where those
# errors lived.

name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Typecheck (src, vite config and api/)
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The suites that assert governed writes need a real database, so CI
      # points at the Neon branch and REQUIRE_LIVE=1 turns a skip into a
      # failure — otherwise the strongest assertions in the repo would report
      # SKIPPED (exit 3) on every push and gate nothing.
      #
      # Two things to know:
      #   - This needs the NEON_DATABASE_URL repository secret. Without it the
      #     run fails rather than silently skipping, which is the point.
      #   - These suites WRITE. They insert TEST-*/E2E-* fixtures and delete
      #     them again, but a run that dies midway leaves rows behind, and two
      #     concurrent runs can overlap. Fixture ids carry a
      #     Date.now().toString(36) suffix, which narrows that window without
      #     closing it. Move to a dedicated Neon test branch before this
      #     database matters to anyone.
      - name: Tests
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          REQUIRE_LIVE: '1'
        run: npm run test:all

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # These browser suites drive the real screens against a stubbed database
      # (tests/ui/db-stub.mjs), so they need no credentials and no dev server.
      # The rest of the BROWSER set in tests/run-all.mjs is deliberately left
      # out: it needs a live Neon database or a server on :5173, so running it
      # here would fail for its infrastructure rather than for the code.
      #
      # The list is explicit for that reason, which means it can drift out of
      # package.json — it did, when the Simple/Expert refactor deleted
      # test:experience-mode-ui and left the call here, failing three pushes in
      # a row. `test:workflow-scripts` (in the gate job) now catches that.
      - name: Browser suites
        run: |
          npm run test:request-detail-ui
          npm run test:service-description-ui
          npm run test:intake-guidance-ui
